# No top-level `name:`: the project name is the clone's directory name, so separate
# clones get separate containers and volumes.

# Container wiring shared by `api` and `ollama-pull`.
x-ollama-url: &ollama-url http://ollama:11434
# The single source of the model-name default (Settings has none). The full tag is
# pinned on purpose: the short `qwen3:4b` tag now points at a thinking-only build
x-ollama-model: &ollama-model ${OLLAMA_MODEL:-qwen3:4b-instruct-2507-q4_K_M}
# Probes run every second during start_period; the first success marks the service healthy.
x-healthcheck-timing: &healthcheck-timing
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 30s
  start_interval: 1s

services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"      # loopback only: Docker port rules bypass ufw
    environment:
      OLLAMA_URL: *ollama-url
      OLLAMA_MODEL: *ollama-model
      SMTP_HOST: mailhog             # SMTP_PORT: 1025 is the Settings default
    depends_on:
      ollama:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
      mailhog:
        condition: service_healthy
    healthcheck:
      # python:3.14-slim has no curl/wget; any exception means a non-zero exit.
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=2)"
      <<: *healthcheck-timing

  mailhog:
    image: mailhog/mailhog:v1.0.1
    platform: linux/amd64          # amd64-only image; emulated on Apple Silicon
    ports:
      - "127.0.0.1:8025:8025"      # UI + HTTP API
      - "127.0.0.1:1025:1025"      # SMTP, for host runs and host e2e tests
    healthcheck:
      # SMTP (what the API needs) and the UI/API (what you and e2e tests need).
      test: ["CMD-SHELL", "nc -z localhost 1025 && wget -q --spider http://localhost:8025/api/v2/messages"]
      <<: *healthcheck-timing

  ollama:
    image: alpine/ollama:0.40.15     # CPU-only build; port 11434 stays internal
    environment:
      # Ollama's own setting (not an app setting): keep the model in RAM (~3.2 GB)
      # until the stack stops, instead of unloading it after 5 idle minutes.
      OLLAMA_KEEP_ALIVE: "-1"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      <<: *healthcheck-timing

  # One-shot: makes the `ollama` server pull the model into its volume and load it into
  # RAM, then exits (docker/ollama_pull.py). `api` waits for it, so the API never starts
  # before the model is loaded. Same base image as the API, so no extra download; the
  # script is bind-mounted, not baked into an image.
  ollama-pull:
    image: python:3.14-slim
    command: ["python", "/ollama_pull.py"]
    volumes:
      # z: relabel for SELinux hosts (Fedora/RHEL), where the container could not read
      # a file from the clone otherwise; ignored where SELinux is off.
      - ./docker/ollama_pull.py:/ollama_pull.py:ro,z
    environment:
      OLLAMA_URL: *ollama-url
      OLLAMA_MODEL: *ollama-model
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  ollama-models:
